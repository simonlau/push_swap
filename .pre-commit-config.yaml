repos:
  - repo: local
    hooks:
      - id: norminette
        name: norminette
        entry: norminette
        language: system
        files: \.[ch]$
        exclude: ^ft_printf/|^tests/
      - id: make-test
        name: make test
        entry: make test
        language: system
        files: ^$
        pass_filenames: false
        always_run: true
